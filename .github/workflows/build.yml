name: Build Aliveness APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the job publish a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build APK (build number = run number, so every push is a newer version)
        run: >
          ./gradlew --no-daemon :app:assembleDebug
          -PappCode=${{ github.run_number }}
          -PappVersion=1.0.${{ github.run_number }}
          -PghRepo=${{ github.repository }}

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Aliveness.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Aliveness-debug-apk
          path: Aliveness.apk
          if-no-files-found: error

      # Release = what the in-app "Check for updates" button reads.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "v1.0.${{ github.run_number }}" Aliveness.apk
          --title "Aliveness 1.0.${{ github.run_number }}"
          --notes "${{ github.event.head_commit.message }}"
